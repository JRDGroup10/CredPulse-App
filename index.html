<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Applies the dark class before first paint. ThemeContext.tsx only
         adds/removes it in a useEffect, which runs after React mounts and
         after the initial paint — fine when light was the default (only
         users who'd already opted into dark saw anything), but now that
         dark is the default for everyone (see getInitialTheme's fallback),
         every new visitor would otherwise see a flash of the light canvas
         before it switches. This mirrors getInitialTheme's exact logic:
         explicit stored choice wins, otherwise default to dark. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("credpulse-theme") !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <!-- Matches the dark-by-default canvas (void canvas #0a0a0a) so mobile
         browser chrome/status bar doesn't flash light before React mounts. -->
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CredPulse" />

    <!-- Primary SEO -->
    <title>CredPulse — Never miss a certification renewal</title>
    <meta name="description" content="CredPulse tracks BLS, ACLS, N95 fit tests, and every other credential healthcare workers need to renew — with reminders before anything lapses. Built for healthcare workers across Canada and the US." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://credpulse.app/" />

    <!-- Open Graph / Facebook, LinkedIn, iMessage, Slack previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CredPulse" />
    <meta property="og:url" content="https://credpulse.app/" />
    <meta property="og:title" content="CredPulse — Never miss a certification renewal" />
    <meta property="og:description" content="Track BLS, ACLS, N95 fit tests, and every other hard-expiry credential — with reminders before anything lapses. Built for healthcare workers across North America." />
    <meta property="og:image" content="https://credpulse.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CredPulse — Never miss a certification renewal" />
    <meta name="twitter:description" content="Track BLS, ACLS, N95 fit tests, and every other hard-expiry credential — with reminders before anything lapses." />
    <meta name="twitter:image" content="https://credpulse.app/og-image.png" />

    <!-- Structured data for Google rich results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CredPulse",
        "url": "https://credpulse.app/",
        "description": "CredPulse tracks BLS, ACLS, N95 fit tests, WHMIS, OSHA compliance, and every other hard-expiry credential healthcare workers need to renew, with reminders before anything lapses.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free plan available; paid plans for tracking more certifications."
        },
        "areaServed": ["CA", "US"],
        "audience": {
          "@type": "Audience",
          "audienceType": "Healthcare workers"
        }
      }
    </script>

    <!-- DM Sans is the Dimension-system display/body face (weight 500 only —
         see index.css/.tailwind.config.js comments for why never bolder).
         Geist isn't on Google Fonts, and the source design doc itself lists
         Inter as Geist's documented substitute, so Inter (already loaded
         below for legacy/fallback text) does double duty as the heading
         face too rather than pulling in a second font CDN. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-canvas">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
