<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eaf4fb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CredPulse" />

    <!-- Primary SEO -->
    <title>CredPulse — Never miss a certification renewal</title>
    <meta name="description" content="CredPulse tracks BLS, ACLS, N95 fit tests, and every other credential healthcare workers need to renew — with reminders before anything lapses. Built for healthcare workers across Canada and the US." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://credpulse.app/" />

    <!-- Open Graph / Facebook, LinkedIn, iMessage, Slack previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CredPulse" />
    <meta property="og:url" content="https://credpulse.app/" />
    <meta property="og:title" content="CredPulse — Never miss a certification renewal" />
    <meta property="og:description" content="Track BLS, ACLS, N95 fit tests, and every other hard-expiry credential — with reminders before anything lapses. Built for healthcare workers across North America." />
    <meta property="og:image" content="https://credpulse.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CredPulse — Never miss a certification renewal" />
    <meta name="twitter:description" content="Track BLS, ACLS, N95 fit tests, and every other hard-expiry credential — with reminders before anything lapses." />
    <meta name="twitter:image" content="https://credpulse.app/og-image.png" />

    <!-- Structured data for Google rich results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CredPulse",
        "url": "https://credpulse.app/",
        "description": "CredPulse tracks BLS, ACLS, N95 fit tests, WHMIS, OSHA compliance, and every other hard-expiry credential healthcare workers need to renew, with reminders before anything lapses.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free plan available; paid plans for tracking more certifications."
        },
        "areaServed": ["CA", "US"],
        "audience": {
          "@type": "Audience",
          "audienceType": "Healthcare workers"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
